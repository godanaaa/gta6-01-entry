<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d16">
    <meta name="description" content="Return to Vespera City, where every street keeps its own record.">
    <title>NIGHTFALL: DISTRICT ZERO</title>
    <style>
      /* The game fills the preview window and has no scrollable page chrome. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080d16;
        color: #edf5fa;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #status {
        position: absolute;
        left: -10000px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="game"
      aria-label="NIGHTFALL: DISTRICT ZERO. Explore Vespera, meet its residents, and evade the police."
    ></canvas>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
