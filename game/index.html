<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080d16">
    <meta name="description" content="A quiet return to Vespera becomes a drive through a city that remembers.">
    <title>NIGHTFALL: DISTRICT ZERO</title>
    <style>
      /* Reserve the entire browser view for the game canvas. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080d16;
        color: #edf5fa;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Keep pointer input on the canvas and avoid browser touch gestures. */
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* Screen readers can announce status without adding visible page chrome. */
      #status {
        position: absolute;
        left: -10000px;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="NIGHTFALL: DISTRICT ZERO. Explore Vespera, meet its residents, and evade the police."></canvas>
    <div id="status" role="status" aria-live="polite"></div>
    <!-- The game code is local so the page works from the included static server. -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
